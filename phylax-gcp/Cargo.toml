[package]
name = "phylax-gcp"
version = "0.2.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "README.md"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE", "infra/**"]
categories = ["authentication", "database"]
keywords = ["oauth2", "firestore", "gcp", "authentication"]
description = "Firestore authentication and identity stores for Phylax."

[dependencies]
arche-firestore = { workspace = true }
phylax-core = { workspace = true }

base64 = { workspace = true }
url = { workspace = true }
anyhow = { workspace = true }
async-trait = "0.1"
firestore = "0.53"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"

ed25519-dalek = { version = "3", features = ["pem", "rand_core"] }
getrandom = "0.4"
sha2 = "0.11"
