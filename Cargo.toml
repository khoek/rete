[workspace]
resolver = "3"
members = [
    "arche-web",
    "arche-firestore",
    "phylax-core",
    "phylax-gcp",
    "phylax-oidc",
]

[workspace.package]
authors = ["Keeley Hoek <keeley@hoek.io>"]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/khoek/rete"
publish = ["crates-io"]

[workspace.dependencies]
arche-firestore = { path = "arche-firestore", version = "0.1" }
phylax-core = { path = "phylax-core", version = "0.1" }

anyhow = "1"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = { version = "2", features = ["serde"] }
